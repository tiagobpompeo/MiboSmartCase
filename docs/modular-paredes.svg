<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-labelledby="t d">
<title id="t">Um bloco só contra módulos com parede</title>
<desc id="d">À esquerda, um módulo único onde oito partes se alcançam por linhas cruzadas e a tela Home chama o Ktor sem ninguém impedir. À direita, onze módulos como tijolos com paredes grossas e poucas setas, todas para baixo; a mesma tentativa da Home bate na parede de core/data.</desc>
